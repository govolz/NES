<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#162E50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NES Outages">
<link rel="apple-touch-icon" href="https://cdn.brandfetch.io/idTKChFcQd/w/400/h/400/theme/dark/icon.jpeg?c=1bxid64Mup7aczewSAYMX">
<title>NES Outage Monitor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f7; --surface:#ffffff; --surface-2:#f3f7fb; --line:#dde5ee; --fs:.9;
    --navy:#162E50; --ink:#1a2a40; --text:#243449; --muted:#5f7285; --muted-2:#93a3b5;
    --cerulean:#097CAE; --cerulean-l:#46c7ec; --orange:#E9692A; --home:#7c3aed;
    --age-green:#18b26b; --age-blue:#2f8fd6; --age-red:#e23d4c;
    --sans:"Space Grotesk",system-ui,-apple-system,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh}

  /* Header */
  header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:calc(13px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 13px max(22px,env(safe-area-inset-left,0px));
    background:var(--navy);color:#fff;border-bottom:3px solid var(--cerulean);position:relative}
  header::after{content:"";position:absolute;left:0;bottom:-3px;height:3px;width:100%;
    background:linear-gradient(90deg,transparent,var(--orange),transparent);opacity:0}
  header.live::after{opacity:.9;animation:sweep 3s linear infinite}
  @keyframes sweep{0%{background-position:-100% 0}100%{background-position:200% 0}}
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
  .eyebrow{font-family:var(--mono);font-size:calc(9.5px*var(--fs));letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .title{font-size:calc(15px*var(--fs));font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
  .bolt{color:var(--orange)}
  .ver{font-family:var(--mono);font-size:calc(10.5px*var(--fs));font-weight:500;color:rgba(255,255,255,.8);
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:6px;
    padding:2px 8px;vertical-align:middle;letter-spacing:.08em;font-variant-numeric:tabular-nums}
  .ver-b{color:var(--cerulean-l);font-weight:600}
  .status-line{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:calc(12px*var(--fs));color:rgba(255,255,255,.7)}
  .dot-live{width:8px;height:8px;border-radius:50%;background:var(--cerulean-l);box-shadow:0 0 0 0 var(--cerulean-l);animation:pulseDot 2s infinite}
  .dot-live.stale{background:var(--orange);animation:none;box-shadow:none}
  @keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(70,199,236,.55)}70%{box-shadow:0 0 0 7px rgba(70,199,236,0)}100%{box-shadow:0 0 0 0 rgba(70,199,236,0)}}
  .live-wrap{display:flex;align-items:center;gap:7px}
  .refresh-btn{font-family:var(--mono);font-size:calc(12px*var(--fs));color:#fff;cursor:pointer;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:7px;
    padding:7px 12px;display:flex;align-items:center;gap:7px;transition:.15s}
  .refresh-btn:hover{border-color:var(--cerulean-l);background:rgba(70,199,236,.15)}
  .refresh-btn:disabled{opacity:.5;cursor:wait}
  .refresh-btn svg{width:13px;height:13px}
  .upd{font-family:var(--mono);font-size:calc(12px*var(--fs));color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:7px 9px;cursor:pointer}
  .upd:focus{outline:none;border-color:var(--cerulean-l)}
  .upd option{color:#1a2a40}
  .tsize{display:flex;align-items:center;gap:5px;font-family:var(--mono);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:6px 10px;cursor:pointer;line-height:1}
  .statstoggle{display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:7px;padding:6px 10px;cursor:pointer;line-height:1}
  .statstoggle:hover{border-color:var(--cerulean-l);background:rgba(70,199,236,.14)}
  .statstoggle .st-chev{font-size:calc(13px*var(--fs));transition:transform .2s;display:inline-block}
  .hidestats .statstoggle .st-chev{transform:rotate(180deg)}
  .hidestats .stats{display:none}
  .tsize:hover{border-color:var(--cerulean-l);background:rgba(70,199,236,.14)}
  .tsize .ts-a{font-weight:700;font-size:calc(15px*var(--fs))}
  .tsize .ts-lvl{font-size:calc(10px*var(--fs));color:var(--cerulean-l);font-weight:600}
  .spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Stats */
  .stats{display:grid;grid-template-columns:1.5fr repeat(5,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
  .stat{background:var(--surface);padding:13px 20px;display:flex;flex-direction:column;gap:3px}
  .stat .label{font-family:var(--mono);font-size:calc(9.5px*var(--fs));letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
  .stat .value{font-size:calc(23px*var(--fs));font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--navy);font-variant-numeric:tabular-nums}
  .stat .sub{font-family:var(--mono);font-size:calc(11px*var(--fs));color:var(--muted)}
  .stat.hero{background:linear-gradient(180deg,#fff,#f7fafd)}
  .stat.hero .value{font-size:calc(30px*var(--fs))}
  .stat.hero .value .pulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--cerulean);margin-left:10px;vertical-align:middle;animation:pulseDot 2s infinite}
  .split{display:flex;gap:14px;margin-top:2px}
  .split span{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--muted)}
  .swatch{width:9px;height:9px;border-radius:2px}
  .sw-un{background:var(--orange)} .sw-as{background:var(--cerulean)}

  /* Body */
  .main{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0;position:relative}
  .main.collapsed{grid-template-columns:1fr}
  .main.collapsed .panel{display:none}
  .side-toggle{position:absolute;top:50%;right:380px;transform:translateY(-50%);z-index:600;
    width:22px;height:58px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.16);border-right:none;
    border-radius:9px 0 0 9px;box-shadow:-2px 0 9px rgba(22,46,80,.2);font-size:calc(15px*var(--fs));line-height:1}
  .side-toggle:hover{background:#20375f}
  .side-toggle::before{content:"\203A"}
  .main.collapsed .side-toggle{right:0}
  .main.collapsed .side-toggle::before{content:"\2039"}
  #map{height:100%;width:100%;background:#e3eaf1}
  .panel{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}

  /* Locate */
  .locate{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
  .locate .lrow{display:flex;gap:7px}
  .locate input{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:calc(13px*var(--fs));border-radius:8px;padding:9px 11px}
  .locate input:focus{outline:none;border-color:var(--cerulean);background:#fff}
  .locate input::placeholder{color:var(--muted-2)}
  .locate .go{background:var(--cerulean);border:none;color:#fff;font-family:var(--mono);font-weight:600;font-size:calc(12px*var(--fs));border-radius:8px;padding:0 15px;cursor:pointer}
  .locate .go:hover{background:var(--cerulean-d,#0a6c98);filter:brightness(1.05)}
  .locate .me{background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-family:var(--mono);font-size:calc(11px*var(--fs));border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:6px;align-self:flex-start}
  .locate .me:hover{border-color:var(--home);color:var(--home)}
  .locate .me svg{width:12px;height:12px}
  .lresult{font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--muted);line-height:1.5;display:none}
  .lresult.show{display:block}
  .lresult b{color:var(--ink);font-weight:600}
  .lresult .ok{color:var(--age-green)} .lresult .hit{color:var(--orange)}
  .lresult .clear{color:var(--home);cursor:pointer;text-decoration:underline;font-size:calc(11px*var(--fs))}

  /* List */
  .panel-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  .panel-head h2{margin:0 0 10px;font-size:calc(13px*var(--fs));font-weight:600;letter-spacing:.02em;color:var(--ink);display:flex;justify-content:space-between;align-items:baseline}
  .panel-head h2 .count{font-family:var(--mono);font-size:calc(12px*var(--fs));color:var(--muted)}
  .controls{display:flex;gap:6px;flex-wrap:wrap}
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:calc(11px*var(--fs));padding:6px 10px;cursor:pointer;transition:.12s}
  .seg button.on{background:#fff;color:var(--cerulean);box-shadow:inset 0 0 0 1px var(--cerulean)}
  .seg button:hover:not(.on){color:var(--ink)}
  select.sort{background:var(--surface-2);border:1px solid var(--line);color:var(--ink);font-family:var(--mono);font-size:calc(11px*var(--fs));border-radius:7px;padding:6px 8px;cursor:pointer;margin-left:auto}
  .sort-label{font-family:var(--mono);font-size:calc(11px*var(--fs));color:var(--muted);align-self:center}
  .list{flex:1;overflow-y:auto;padding:6px}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .item{padding:11px 12px;border-radius:9px;cursor:pointer;transition:.12s;border:1px solid transparent;display:flex;flex-direction:column;gap:6px}
  .item:hover{background:var(--surface-2);border-color:var(--line)}
  .item.active{background:#eef7fb;border-color:var(--cerulean)}
  .item .row1{display:flex;align-items:center;gap:9px}
  .item .sdot{width:11px;height:11px;border-radius:50%;flex:none}
  .item .sdot.tri{width:0;height:0;border-radius:0;background:none!important;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--age-red)}
  .item .people{font-size:calc(16px*var(--fs));font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .item .people small{font-size:calc(11px*var(--fs));color:var(--muted);font-weight:400;margin-left:4px}
  .item .st{margin-left:auto;font-family:var(--mono);font-size:calc(10px*var(--fs));letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px}
  .st.un{color:var(--orange);background:rgba(233,105,42,.12)}
  .st.as{color:var(--cerulean);background:rgba(9,124,174,.12)}
  .item .row2{display:flex;gap:13px;font-family:var(--mono);font-size:calc(11px*var(--fs));color:var(--muted);flex-wrap:wrap}
  .item .row2 .etr.passed{color:var(--orange);font-weight:600}
  .item .row2 .etr.soon{color:var(--cerulean)}
  .item .row2 .dist{color:var(--home)}
  .item .id{color:var(--muted-2)}
  .empty{padding:50px 24px;text-align:center;color:var(--muted)}
  .empty .big{font-size:calc(15px*var(--fs));color:var(--age-green);font-weight:600;margin-bottom:6px}

  /* Banner */
  .banner{display:none;padding:9px 22px;font-family:var(--mono);font-size:calc(12px*var(--fs));align-items:center;gap:10px;border-bottom:1px solid var(--line)}
  .banner.show{display:flex}
  .banner.warn{background:rgba(233,105,42,.1);color:var(--orange)}

  /* Markers */
  .mksvg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
  .mksvg.blink-slow{animation:blink 2s ease-in-out infinite}
  .mksvg.blink-fast{animation:blink .55s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.22}}

  /* Cluster */
  .cluster{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--mono);font-weight:600;border:2px solid #fff;box-shadow:0 2px 9px rgba(0,0,0,.3)}
  .cluster span{font-size:calc(12px*var(--fs));line-height:1}
  .cluster.cl-green{background:rgba(24,178,107,.92)}
  .cluster.cl-blue{background:rgba(47,143,214,.92)}
  .cluster.cl-red{background:rgba(226,61,76,.95)}
  .cluster.blink-slow{animation:blink 2s ease-in-out infinite}
  .cluster.blink-fast{animation:blink .55s ease-in-out infinite}

  /* Popup */
  .leaflet-popup-content-wrapper{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 34px rgba(22,46,80,.22)}
  .leaflet-popup-tip{background:#fff;border:1px solid var(--line)}
  .leaflet-popup-content{margin:13px 15px;font-family:var(--sans)}
  .pop h3{margin:0 0 8px;font-size:calc(15px*var(--fs));color:var(--ink);display:flex;align-items:center;gap:8px}
  .pop .pst{font-family:var(--mono);font-size:calc(10px*var(--fs));letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:5px}
  .pop .pst.un{color:var(--orange);background:rgba(233,105,42,.12)} .pop .pst.as{color:var(--cerulean);background:rgba(9,124,174,.12)}
  .pop table{border-collapse:collapse;font-family:var(--mono);font-size:calc(12px*var(--fs))}
  .pop td{padding:2px 0;color:var(--ink)} .pop td:first-child{color:var(--muted);padding-right:16px}

  /* Legend */
  .legend{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:var(--mono);font-size:calc(11px*var(--fs));color:var(--ink);box-shadow:0 2px 12px rgba(22,46,80,.14);line-height:1.7}
  .legend .lg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;padding:3px 5px;margin:-3px -5px;border-radius:6px}
  .legend .lg-head:hover{background:rgba(22,46,80,.06)}
  .legend .lg-head:active{background:rgba(22,46,80,.11)}
  .legend .lg-title{font-size:calc(10px*var(--fs));letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
  .legend .lg-toggle{width:19px;height:19px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;font-size:calc(14px*var(--fs));font-weight:700;line-height:1;color:var(--muted)}
  .legend .lg-toggle::before{content:"–"}
  .legend.collapsed .lg-toggle::before{content:"+"}
  .legend.collapsed .lg-body{display:none}
  .legend .lg-body{margin-top:8px}
  .legend .lg-t{font-size:calc(10px*var(--fs));letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);margin-bottom:3px}
  .lg-row{display:flex;align-items:center}
  .lg-mk{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:7px;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
  .lg-mk.grn{background:var(--age-green)} .lg-mk.blu{background:var(--age-blue)} .lg-mk.red{background:var(--age-red)}
  .lg-tri{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--age-red);display:inline-block;margin-right:7px}
  .lg-sep{height:1px;background:var(--line);margin:6px 0}
  .lg-sm{color:var(--muted);font-size:calc(10.5px*var(--fs))}

  .homepin{width:20px;height:20px;border-radius:50% 50% 50% 0;background:var(--home);transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}

  .mapmax-btn{position:absolute;right:10px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:660;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:var(--navy);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:8px;box-shadow:0 2px 8px rgba(22,46,80,.3);padding:0}
  .mapmax-btn:hover{background:#20375f}
  .mapmax-btn svg{width:18px;height:18px}
  .mapmax-btn .ic-con{display:none}
  #map.mapmax{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:9999}
  #map.mapmax .ic-exp{display:none}
  #map.mapmax .ic-con{display:block}

  .logo{height:24px;width:auto;vertical-align:middle;display:inline-block;filter:brightness(0) invert(1)}
  .radarctl{background:var(--navy);color:#fff;border-radius:10px;padding:9px 11px;width:174px;
    box-shadow:0 2px 13px rgba(22,46,80,.3);font-family:var(--mono)}
  .radarctl .rc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;padding:3px 5px;margin:-3px -5px;border-radius:6px}
  .radarctl .rc-head:hover{background:rgba(255,255,255,.09)}
  .radarctl .rc-head:active{background:rgba(255,255,255,.16)}
  .radarctl .rc-title{font-size:calc(11px*var(--fs));font-weight:600;letter-spacing:.02em}
  .radarctl .rc-toggle{width:19px;height:19px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35);border-radius:5px;font-size:calc(14px*var(--fs));font-weight:700;line-height:1}
  .radarctl .rc-toggle::before{content:"–"}
  .radarctl.collapsed .rc-toggle::before{content:"+"}
  .radarctl.collapsed .rc-body{display:none}
  .radarctl .rc-body{margin-top:8px}
  .radarctl .rc-time-row{margin-bottom:4px}
  .radarctl .rc-time{font-size:calc(10.5px*var(--fs));color:var(--cerulean-l);white-space:nowrap}
  .radarctl input[type=range]{width:100%;accent-color:var(--cerulean-l);cursor:pointer;margin:3px 0;height:20px}
  .radarctl .rc-foot{display:flex;justify-content:space-between;font-size:calc(10.5px*var(--fs));color:rgba(255,255,255,.6);margin-top:2px}

  @media(max-width:900px){
    body{overflow:auto}
    #app{height:auto;min-height:100vh}
    header{gap:12px 16px}
    .status-line{order:3;flex-basis:100%;gap:14px}
    .refresh-btn{padding:9px 14px;min-height:40px}
    .stats{grid-template-columns:1fr 1fr}
    .stat{padding:12px 15px}
    .stat.hero{grid-column:1/-1}
    .stat .value{font-size:calc(26px*var(--fs))}
    .stat.hero .value{font-size:calc(34px*var(--fs))}
    .main{grid-template-columns:1fr;height:auto}
    #map{height:50vh;min-height:300px}
    .panel{border-left:none;border-top:1px solid var(--line)}
    .side-toggle{display:none}
    .main.collapsed{grid-template-columns:1fr}
    .main.collapsed .panel{display:flex}
    .list{max-height:none;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
    .locate input{font-size:calc(16px*var(--fs));padding:12px 12px}
    .locate .go{padding:0 18px;min-height:46px;font-size:calc(13px*var(--fs))}
    .locate .me{padding:11px 13px;min-height:42px;font-size:calc(12px*var(--fs))}
    .controls{gap:8px}
    .seg{flex-basis:100%}
    .seg button{flex:1;padding:11px 6px;font-size:calc(11.5px*var(--fs));text-align:center;white-space:nowrap}
    select.sort{margin-left:0;flex-basis:100%;padding:11px 10px;font-size:calc(13px*var(--fs))}
    .item{padding:13px 12px}
    .legend{font-size:calc(10.5px*var(--fs));padding:8px 10px;line-height:1.6}
    .leaflet-popup-content{margin:12px 14px;max-width:70vw}
    .leaflet-control-zoom{margin-bottom:70px!important}
    .radarctl{width:150px;padding:8px 10px}
  }
  @media(max-width:560px){
    header{padding-top:calc(11px + env(safe-area-inset-top,0px));gap:10px 14px}
    .title{font-size:calc(18px*var(--fs))}
    .eyebrow{font-size:calc(9.5px*var(--fs));letter-spacing:.18em}
    .status-line{font-size:calc(11px*var(--fs));gap:12px}
    #countdown{display:none}
    .stat{padding:11px 13px}
    .stat .label{font-size:calc(9.5px*var(--fs));letter-spacing:.1em}
    .stat .value{font-size:calc(22px*var(--fs))}
    .stat.hero .value{font-size:calc(30px*var(--fs))}
    .split{flex-direction:column;gap:4px}
    #map{height:46vh;min-height:280px}
  }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="brand">
      <span class="eyebrow">Nashville Electric Service · Live Grid Status</span>
      <span class="title"><img class="logo" src="https://cdn.brandfetch.io/idTKChFcQd/theme/dark/logo.svg?c=1bxid64Mup7aczewSAYMX" alt="NES" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'bolt',textContent:'⚡'}))"> Outage Monitor <span class="ver" id="ver"></span></span>
    </div>
    <div class="status-line">
      <span class="live-wrap"><span class="dot-live" id="liveDot"></span><span id="liveText">Connecting…</span></span>
      <span id="updated">—</span>
      <span id="countdown"></span>
    </div>
    <button class="statstoggle" id="statsToggle" title="Show/hide stats" aria-label="Toggle stats"><span class="st-chev">⌄</span></button>
    <button class="tsize" id="tsizeBtn" title="Text size"><span class="ts-a">A</span><span class="ts-lvl" id="tsizeLvl">S</span></button>
    <select class="upd" id="updSel" title="Auto-update interval">
      <option value="60000">1 min</option>
      <option value="300000">5 min</option>
      <option value="600000" selected>10 min</option>
    </select>
    <button class="refresh-btn" id="refreshBtn">
      <svg id="refreshIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      Refresh
    </button>
  </header>

  <div class="banner" id="banner"></div>

  <div class="stats" id="stats">
    <div class="stat hero"><span class="label">Customers affected</span>
      <span class="value" id="sTotal">—<span class="pulse"></span></span>
      <span class="sub" id="sTotalSub"></span></div>
    <div class="stat"><span class="label">Active outages</span>
      <span class="value" id="sEvents">—</span><span class="sub">on the system</span></div>
    <div class="stat"><span class="label">Largest outage</span>
      <span class="value" id="sMax">—</span><span class="sub">customers</span></div>
    <div class="stat"><span class="label">ETR passed</span>
      <span class="value" id="sPassed">—</span><span class="sub">still restoring</span></div>
    <div class="stat"><span class="label">Median duration</span>
      <span class="value" id="sMed">—</span><span class="sub">so far</span></div>
    <div class="stat"><span class="label">Weighted avg out</span>
      <span class="value" id="sCmin">—</span><span class="sub">min / customer · live</span></div>
  </div>

  <div class="main">
    <div id="map"></div>
    <div class="panel">
      <div class="locate">
        <div class="lrow">
          <input id="addr" type="text" placeholder="Check an address or ZIP…" autocomplete="off">
          <button class="go" id="goBtn">Check</button>
        </div>
        <button class="me" id="meBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          Use my location
        </button>
        <div class="lresult" id="lresult"></div>
      </div>
      <div class="panel-head">
        <h2>Active outages <span class="count" id="listCount"></span></h2>
        <div class="controls">
          <span class="sort-label">Sort by</span>
          <select class="sort" id="sort">
            <option value="people">Most customers</option>
            <option value="new">Newest</option>
            <option value="old" selected>Longest out</option>
            <option value="etr">Soonest ETR</option>
            <option value="dist">Nearest me</option>
          </select>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
    <button class="side-toggle" id="sideToggle" title="Show/hide list" aria-label="Toggle list panel"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script>
const API="https://utilisocial.io/datacapable/v2/p/NES/map/events";
const PROXY=u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u);
const REFRESH_MS=60000;
const VERSION="26.08.06e";
document.getElementById('ver').innerHTML=VERSION.slice(0,-1)+'<span class="ver-b">'+VERSION.slice(-1)+'</span>';

const AGE={green:'#18b26b',blue:'#2f8fd6',red:'#e23d4c'};

// Sample data (used only if the live feed is blocked); spread across ages + a downtown cluster to show the marker scale.
function sampleData(){const n=Date.now(),M=60000;return [
  {id:1,startTime:n-4*M,etrTime:n+90*M,numPeople:6,status:'Unassigned',cause:'',identifier:'D-1001',latitude:36.1900,longitude:-86.7850},
  {id:2,startTime:n-45*M,etrTime:n+20*M,numPeople:34,status:'Assigned',cause:'Equipment',identifier:'D-1002',latitude:36.0755,longitude:-86.9667},
  {id:3,startTime:n-150*M,etrTime:n-8*M,numPeople:210,status:'Assigned',cause:'Tree',identifier:'D-1003',latitude:36.1480,longitude:-86.8566},
  {id:4,startTime:n-205*M,etrTime:n+40*M,numPeople:1180,status:'Assigned',cause:'Storm',identifier:'D-1004',latitude:35.9956,longitude:-86.7007},
  {id:5,startTime:n-8*M,etrTime:n+120*M,numPeople:3,status:'Unassigned',cause:'',identifier:'D-1005',latitude:36.1360,longitude:-86.8589},
  {id:6,startTime:n-95*M,etrTime:n-2*M,numPeople:52,status:'Assigned',cause:'Equipment',identifier:'D-1006',latitude:36.1204,longitude:-86.8945},
  {id:7,startTime:n-175*M,etrTime:n+15*M,numPeople:88,status:'Assigned',cause:'Animal',identifier:'D-1007',latitude:36.2400,longitude:-86.7200},
  {id:8,startTime:n-260*M,etrTime:n-30*M,numPeople:640,status:'Unassigned',cause:'Storm',identifier:'D-1008',latitude:36.3000,longitude:-86.6200},
  {id:9,startTime:n-20*M,etrTime:n+60*M,numPeople:5,status:'Assigned',cause:'',identifier:'D-1009',latitude:36.1626,longitude:-86.7816},
  {id:10,startTime:n-30*M,etrTime:n+50*M,numPeople:12,status:'Unassigned',cause:'',identifier:'D-1010',latitude:36.1660,longitude:-86.7790},
  {id:11,startTime:n-12*M,etrTime:n+70*M,numPeople:2,status:'Assigned',cause:'',identifier:'D-1011',latitude:36.1600,longitude:-86.7840}
];}

const map=L.map('map',{zoomControl:true,attributionControl:true,maxZoom:18}).setView([36.16,-86.78],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  {attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:20,zIndex:1}).addTo(map);

const clusterGroup=L.markerClusterGroup({
  maxClusterRadius:46,spiderfyOnMaxZoom:true,showCoverageOnHover:false,
  iconCreateFunction:c=>{
    const kids=c.getAllChildMarkers();
    let sum=0,aMax=0,eMax=0;
    kids.forEach(m=>{const e=m.options.ev;if(!e)return;sum+=e.numPeople||0;
      aMax=Math.max(aMax,ageRank(e.startTime));
      const st=etrInfo(e).state;eMax=Math.max(eMax,st==='passed'?2:st==='soon'?1:0);});
    const size=sum>=500?54:sum>=100?46:sum>=20?40:34;
    const col=aMax>=2?'cl-red':aMax===1?'cl-blue':'cl-green';
    const bl=eMax===2?'blink-fast':eMax===1?'blink-slow':'';
    return L.divIcon({html:`<div class="cluster ${col} ${bl}" style="width:${size}px;height:${size}px"><span>${fmt(sum)}</span></div>`,className:'',iconSize:[size,size]});
  }
});
map.addLayer(clusterGroup);

// Legend
const legend=L.control({position:'bottomleft'});
legend.onAdd=function(){const d=L.DomUtil.create('div','legend');
  d.innerHTML='<div class="lg-head"><span class="lg-title">Legend</span><span class="lg-toggle"></span></div>'
    +'<div class="lg-body">'
    +'<div class="lg-t">Time out</div>'
    +'<div class="lg-row"><span class="lg-mk grn"></span>Under 1 hr</div>'
    +'<div class="lg-row"><span class="lg-mk blu"></span>1 – 2 hr</div>'
    +'<div class="lg-row"><span class="lg-mk red"></span>2 – 3 hr</div>'
    +'<div class="lg-row"><span class="lg-tri"></span>Over 3 hr</div>'
    +'<div class="lg-sep"></div>'
    +'<div class="lg-row lg-sm">Blink · slow = ETR within 30 min · fast = past ETR</div>'
    +'</div>';
  L.DomEvent.disableClickPropagation(d);
  d.querySelector('.lg-head').addEventListener('click',()=>d.classList.toggle('collapsed'));
  if(window.innerWidth<=560)d.classList.add('collapsed');
  return d;};
legend.addTo(map);

// Weather radar (RainViewer) + 0–100 opacity slider
let radarLayer=null,radarOpacity=0.6,radarColor=6; // color 6 = NEXRAD Level III
const radarCtl=L.control({position:'topright'});
radarCtl.onAdd=function(){const d=L.DomUtil.create('div','radarctl');
  d.innerHTML=`<div class="rc-head"><span class="rc-title">Weather radar</span><span class="rc-toggle"></span></div>
    <div class="rc-body">
      <div class="rc-time-row"><span class="rc-time" id="radarTime">loading…</span></div>
      <input type="range" min="0" max="100" value="60" id="radarSlider" aria-label="Radar opacity">
      <div class="rc-foot"><span>Opacity</span><span id="radarPct">60%</span></div>
    </div>`;
  L.DomEvent.disableClickPropagation(d);L.DomEvent.disableScrollPropagation(d);
  d.querySelector('.rc-head').addEventListener('click',()=>d.classList.toggle('collapsed'));
  if(window.innerWidth<=560)d.classList.add('collapsed');
  return d;};
radarCtl.addTo(map);
document.getElementById('radarSlider').addEventListener('input',e=>{
  radarOpacity=+e.target.value/100;
  document.getElementById('radarPct').textContent=e.target.value+'%';
  if(radarLayer)radarLayer.setOpacity(radarOpacity);
});
async function initRadar(){
  try{
    const r=await fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'});
    const j=await r.json();
    const past=(j.radar&&j.radar.past)||[];
    if(!past.length)throw 0;
    const f=past[past.length-1];
    const url=`${j.host}${f.path}/256/{z}/{x}/{y}/${radarColor}/1_1.png`;
    if(radarLayer)map.removeLayer(radarLayer);
    radarLayer=L.tileLayer(url,{opacity:radarOpacity,zIndex:2,maxNativeZoom:7,maxZoom:18,errorTileUrl:'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==',attribution:'Radar &copy; RainViewer'});
    radarLayer.addTo(map);
    const el=document.getElementById('radarTime');
    if(el)el.textContent=new Date(f.time*1000).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  }catch(e){const el=document.getElementById('radarTime');if(el)el.textContent='unavailable';}
}
initRadar();
setInterval(initRadar,5*60000);

// Maximize map to full screen extent (CSS-based; no Fullscreen API needed)
const maxBtn=L.DomUtil.create('button','mapmax-btn');
maxBtn.type='button';maxBtn.setAttribute('title','Maximize map');maxBtn.setAttribute('aria-label','Maximize map');
maxBtn.innerHTML=`<svg class="ic-exp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>`
  +`<svg class="ic-con" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"/></svg>`;
map.getContainer().appendChild(maxBtn);
L.DomEvent.disableClickPropagation(maxBtn);
const mapEl=document.getElementById('map');
maxBtn.addEventListener('click',()=>{mapEl.classList.toggle('mapmax');setTimeout(()=>map.invalidateSize(),80);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mapEl.classList.contains('mapmax')){mapEl.classList.remove('mapmax');setTimeout(()=>map.invalidateSize(),80);}});

let events=[],markers={},activeId=null,filter="all",sort="old",nextRefresh=0;
let home=null,homeMarker=null;

const fmt=n=>n.toLocaleString('en-US');
function compact(n){n=Math.round(n);if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e4)return (n/1e3).toFixed(1)+'k';return n.toLocaleString('en-US');}
function fmtDur(m){if(m<1)return'0m';if(m<60)return Math.round(m)+'m';const h=Math.floor(m/60),r=Math.round(m%60);return r?h+'h '+r+'m':h+'h';}
function updateCmin(){const el=document.getElementById('sCmin');if(!el)return;
  if(!events.length){el.textContent='—';return;}
  const now=Date.now();
  const cmin=events.reduce((s,e)=>s+e.numPeople*((now-e.startTime)/60000),0);
  const cust=events.reduce((s,e)=>s+e.numPeople,0);
  el.textContent=cust?fmtDur(cmin/cust):'—';}
const isUn=e=>(e.status||"").toLowerCase()!=="assigned";
function rel(ms){const d=Math.abs(Date.now()-ms),m=Math.round(d/60000);
  if(m<1)return"just now";if(m<60)return m+"m";const h=Math.floor(m/60),r=m%60;return r?`${h}h ${r}m`:`${h}h`;}
function miles(a,b,c,d){const R=3958.8,t=x=>x*Math.PI/180;
  const dLa=t(c-a),dLo=t(d-b);const q=Math.sin(dLa/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));}
function distTo(e){return home?miles(home.lat,home.lng,e.latitude,e.longitude):null;}
function markerSize(n){return Math.max(15,Math.min(46,11+Math.sqrt(n)*3.2));}
function ageRank(start){const m=(Date.now()-start)/60000;return m>=180?3:m>=120?2:m>=60?1:0;}
function styleKey(e){return ageRank(e.startTime)+'|'+etrInfo(e).state;}

// color/shape by how long it's been out
function ageStyle(start){const min=(Date.now()-start)/60000;
  if(min<60)return{shape:'circle',color:AGE.green};
  if(min<120)return{shape:'circle',color:AGE.blue};
  if(min<180)return{shape:'circle',color:AGE.red};
  return{shape:'triangle',color:AGE.red};}
// blink by ETR proximity
function etrInfo(e){if(!e.etrTime)return{txt:'ETR pending',state:'none'};
  const diff=e.etrTime-Date.now();
  if(diff<0)return{txt:'ETR passed '+rel(e.etrTime)+' ago',state:'passed'};
  if(diff<=30*60000)return{txt:'ETR in '+rel(e.etrTime),state:'soon'};
  return{txt:'ETR in '+rel(e.etrTime),state:'ok'};}
const blinkClass=state=>state==='passed'?'blink-fast':state==='soon'?'blink-slow':'';

function markerHtml(e,s){
  const a=ageStyle(e.startTime),bl=blinkClass(etrInfo(e).state),cls=('mksvg '+bl).trim();
  if(a.shape==='triangle'){const p=`${s/2},1.5 ${s-1.5},${s-1.5} 1.5,${s-1.5}`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" class="${cls}"><polygon points="${p}" fill="${a.color}" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>`;}
  const r=s/2-2;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" class="${cls}"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="${a.color}" stroke="#fff" stroke-width="2"/></svg>`;
}

function drawMarkers(list){
  clusterGroup.clearLayers();markers={};
  list.forEach(e=>{
    const s=markerSize(e.numPeople);
    const icon=L.divIcon({html:markerHtml(e,s),className:'',iconSize:[s,s],iconAnchor:[s/2,s/2]});
    const m=L.marker([e.latitude,e.longitude],{icon,people:e.numPeople,ev:e,_sk:styleKey(e)});
    const un=isUn(e),et=etrInfo(e),d=distTo(e);
    m.bindPopup(`<div class="pop"><h3>${fmt(e.numPeople)} customer${e.numPeople===1?'':'s'} out</h3>
      <table>
        <tr><td>Out for</td><td>${rel(e.startTime)}</td></tr>
        <tr><td>Est. restore</td><td>${et.txt}</td></tr>
        ${e.cause?`<tr><td>Cause</td><td>${e.cause}</td></tr>`:''}
        ${d!=null?`<tr><td>From you</td><td>${d.toFixed(1)} mi</td></tr>`:''}
        <tr><td>Event</td><td>#${e.identifier||e.id}</td></tr>
      </table></div>`);
    m.on('click',()=>setActive(e.id,false));
    markers[e.id]=m;clusterGroup.addLayer(m);
  });
}

function refreshMarkerStyles(){
  let changed=false;
  events.forEach(e=>{const m=markers[e.id];if(!m)return;
    const sk=styleKey(e);
    if(m.options._sk!==sk){const s=markerSize(e.numPeople);
      m.setIcon(L.divIcon({html:markerHtml(e,s),className:'',iconSize:[s,s],iconAnchor:[s/2,s/2]}));
      m.options._sk=sk;changed=true;}});
  if(changed&&clusterGroup.refreshClusters)clusterGroup.refreshClusters();
}
function drawList(){
  let list=events.slice();
  if(filter==="un")list=list.filter(isUn);
  if(filter==="as")list=list.filter(e=>!isUn(e));
  if(sort==="people")list.sort((a,b)=>b.numPeople-a.numPeople);
  if(sort==="new")list.sort((a,b)=>b.startTime-a.startTime);
  if(sort==="old")list.sort((a,b)=>a.startTime-b.startTime);
  if(sort==="etr")list.sort((a,b)=>(a.etrTime||Infinity)-(b.etrTime||Infinity));
  if(sort==="dist"&&home)list.sort((a,b)=>distTo(a)-distTo(b));

  const el=document.getElementById('list');
  document.getElementById('listCount').textContent=list.length?`${list.length} shown`:'';
  if(!events.length){el.innerHTML=`<div class="empty"><div class="big">All clear</div>No active outages on the NES system right now.</div>`;return;}
  if(!list.length){el.innerHTML=`<div class="empty">No outages match this filter.</div>`;return;}

  el.innerHTML=list.map(e=>{
    const un=isUn(e),et=etrInfo(e),a=ageStyle(e.startTime),d=distTo(e);
    const dot=a.shape==='triangle'?'<span class="sdot tri"></span>':`<span class="sdot" style="background:${a.color}"></span>`;
    return `<div class="item ${activeId===e.id?'active':''}" data-id="${e.id}">
      <div class="row1">
        ${dot}
        <span class="people">${fmt(e.numPeople)}<small>out</small></span>
      </div>
      <div class="row2">
        <span>Out ${rel(e.startTime)}</span>
        <span class="etr ${et.state==='passed'?'passed':et.state==='soon'?'soon':''}">${et.txt}</span>
        ${d!=null?`<span class="dist">${d.toFixed(1)} mi</span>`:''}
        <span class="id">#${e.identifier||e.id}</span>
      </div></div>`;
  }).join('');
  el.querySelectorAll('.item').forEach(it=>it.onclick=()=>setActive(+it.dataset.id,true));
}

function setActive(id,fly){
  activeId=id;drawList();
  const e=events.find(x=>x.id===id),m=markers[id];
  if(e&&m){
    if(fly){clusterGroup.zoomToShowLayer(m,()=>{setTimeout(()=>m.openPopup(),120);});}
    else{m.openPopup();}
  }
  const act=document.querySelector('.item.active');
  if(act)act.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function drawStats(){
  const total=events.reduce((s,e)=>s+e.numPeople,0);
  const max=events.reduce((m,e)=>Math.max(m,e.numPeople),0);
  const passed=events.filter(e=>e.etrTime&&e.etrTime<Date.now()).length;
  const durs=events.map(e=>Date.now()-e.startTime).sort((a,b)=>a-b);
  const med=durs.length?durs[Math.floor(durs.length/2)]:0;
  document.getElementById('sTotal').innerHTML=fmt(total)+'<span class="pulse"></span>';
  document.getElementById('sTotalSub').textContent=events.length?`across ${events.length} active event${events.length===1?'':'s'}`:'system clear';
  document.getElementById('sEvents').textContent=events.length;
  document.getElementById('sMax').textContent=fmt(max);
  document.getElementById('sPassed').textContent=passed;
  document.getElementById('sMed').textContent=med?rel(Date.now()-med):'—';
  updateCmin();
}

// ---- Location ----
function setHome(lat,lng,label){
  home={lat,lng};
  if(homeMarker)map.removeLayer(homeMarker);
  homeMarker=L.marker([lat,lng],{icon:L.divIcon({html:'<div class="homepin"></div>',className:'',iconSize:[20,20],iconAnchor:[10,20]}),zIndexOffset:1000}).addTo(map);
  map.flyTo([lat,lng],12,{duration:.6});
  drawMarkers(events);drawList();showNearest(label);
}
function showNearest(label){
  const box=document.getElementById('lresult');box.classList.add('show');
  if(!events.length){box.innerHTML=`<b>${label}</b><br><span class="ok">No active outages on the NES system.</span> <span class="clear" id="clearHome">clear</span>`;wireClear();return;}
  let near=null,best=Infinity;
  events.forEach(e=>{const dd=distTo(e);if(dd<best){best=dd;near=e;}});
  if(best<=0.6){
    box.innerHTML=`<b>${label}</b><br><span class="hit">You may be in an affected area.</span> Nearest outage ${best.toFixed(1)} mi — ${fmt(near.numPeople)} out, ${etrInfo(near).txt.toLowerCase()}. <span class="clear" id="clearHome">clear</span>`;
  }else{
    box.innerHTML=`<b>${label}</b><br><span class="ok">No outage within 0.6 mi.</span> Nearest is ${best.toFixed(1)} mi away (${fmt(near.numPeople)} out). <span class="clear" id="clearHome">clear</span>`;
  }
  wireClear();
}
function wireClear(){const c=document.getElementById('clearHome');if(c)c.onclick=()=>{
  home=null;if(homeMarker){map.removeLayer(homeMarker);homeMarker=null;}
  document.getElementById('lresult').classList.remove('show');
  if(sort==="dist"){sort="people";document.getElementById('sort').value="people";}
  drawMarkers(events);drawList();};}

async function geocode(q){
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&viewbox=-87.15,36.45,-86.45,35.85&bounded=1&q="+encodeURIComponent(q);
  const r=await fetch(url,{headers:{'Accept':'application/json'}});
  const j=await r.json();
  if(!j.length)throw new Error("not found");
  return{lat:+j[0].lat,lng:+j[0].lon,label:j[0].display_name.split(',').slice(0,2).join(',')};
}
document.getElementById('goBtn').onclick=doSearch;
document.getElementById('addr').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
async function doSearch(){
  const q=document.getElementById('addr').value.trim();if(!q)return;
  const box=document.getElementById('lresult');box.classList.add('show');box.innerHTML='Searching…';
  try{const g=await geocode(q);setHome(g.lat,g.lng,g.label);}
  catch{box.innerHTML='<span class="hit">Couldn\'t find that address.</span> Try a street + city, or a ZIP in the NES area.';}
}
document.getElementById('meBtn').onclick=()=>{
  const box=document.getElementById('lresult');box.classList.add('show');box.innerHTML='Locating…';
  if(!navigator.geolocation){box.innerHTML='<span class="hit">Location isn\'t available in this browser.</span> Try searching your address.';return;}
  navigator.geolocation.getCurrentPosition(
    p=>setHome(p.coords.latitude,p.coords.longitude,'Your location'),
    ()=>{box.innerHTML='<span class="hit">Couldn\'t get your location.</span> Try searching your address instead.';},
    {timeout:8000});
};

// ---- Load with proxy fallback ----
async function fetchEvents(){
  try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;return{data:await r.json(),mode:'direct'};}catch(e){}
  try{const r=await fetch(PROXY(API),{cache:'no-store'});if(!r.ok)throw 0;return{data:await r.json(),mode:'proxy'};}catch(e){}
  return{data:sampleData(),mode:'offline'};
}
async function load(){
  const btn=document.getElementById('refreshBtn'),ic=document.getElementById('refreshIcon');
  btn.disabled=true;ic.classList.add('spin');
  const {data,mode}=await fetchEvents();
  events=Array.isArray(data)?data:sampleData();
  const live=mode!=='offline';
  document.getElementById('header').classList.toggle('live',live);
  document.getElementById('liveDot').classList.toggle('stale',!live);
  document.getElementById('liveText').textContent=mode==='direct'?'Live':mode==='proxy'?'Live · via proxy':'Sample (offline)';
  document.getElementById('updated').textContent='Updated '+new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  banner(mode==='offline');
  drawStats();drawMarkers(events);drawList();
  if(home)showNearest(document.querySelector('#lresult b')?.textContent||'Your location');
  if(activeId&&!events.find(e=>e.id===activeId))activeId=null;
  btn.disabled=false;ic.classList.remove('spin');
  nextRefresh=Date.now()+refreshMs;
}
function banner(show){
  const b=document.getElementById('banner');b.className='banner'+(show?' show warn':'');
  if(show)b.innerHTML='⚠ Live feed unreachable (browser CORS + proxy both blocked). Showing sample data so you can see the display.';
}

let refreshMs=600000,refreshTimer=null;
function startRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(load,refreshMs);nextRefresh=Date.now()+refreshMs;}
document.getElementById('updSel').onchange=e=>{refreshMs=+e.target.value;startRefresh();e.target.blur();};
startRefresh();
setInterval(()=>{const s=Math.max(0,Math.round((nextRefresh-Date.now())/1000));
  const disp=s>=60?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':s+'s';
  document.getElementById('countdown').textContent='next in '+disp;
  updateCmin();},1000);
setInterval(()=>{if(events.length){drawList();drawStats();}},30000);
setInterval(()=>{if(events.length)refreshMarkerStyles();},2000);

document.getElementById('sort').onchange=e=>{sort=e.target.value;
  if(sort==='dist'&&!home){document.getElementById('lresult').classList.add('show');
    document.getElementById('lresult').innerHTML='Set your location above to sort by distance.';}
  drawList();};
document.getElementById('refreshBtn').onclick=()=>load();

document.getElementById('statsToggle').onclick=()=>{
  document.getElementById('app').classList.toggle('hidestats');
  setTimeout(()=>map.invalidateSize(),60);
};

document.getElementById('sideToggle').onclick=()=>{
  document.querySelector('.main').classList.toggle('collapsed');
  setTimeout(()=>map.invalidateSize(),60);
};

const TSIZES=[['XS',.8],['S',.9],['M',1],['L',1.2],['XL',1.45]];
let tsizeIdx=1;
function applyTsize(){document.documentElement.style.setProperty('--fs',TSIZES[tsizeIdx][1]);document.getElementById('tsizeLvl').textContent=TSIZES[tsizeIdx][0];}
document.getElementById('tsizeBtn').onclick=()=>{tsizeIdx=(tsizeIdx+1)%TSIZES.length;applyTsize();};
applyTsize();

load();
</script>
</body>
